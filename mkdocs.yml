site_name: Frontier Counts - Developer Documentation
site_url: https://dsd4.gitlab.io/frontier-counts/fc-pipeline/
site_description: Documentation for the Frontier Counts System
copyright: Copyright &copy; 2020 Statistics Canada

theme:
        name: material
        palette:
                primary: amber
                accent: teal
        show_sidebar: false
        #logo: images/statcan.png

markdown_extensions:
        - toc:
                  baselevel: 2
                  permalink: true
        - attr_list
        - admonition
        - codehilite
        - pymdownx.details
        - pymdownx.snippets:
                  base_path: [".", "docs", ".."]

extra:
        social:
                - icon: fontawesome/brands/gitlab
                  link: https://gitlab.com/dsd4/frontier-counts/fc-pipeline/-/tree/master/
        fc_baseurl:
                doc: "/frontiercounts/frontier-counts/fc-pipeline"
                repo: https://gitlab.k8s.cloud.statcan.ca/tourism-tourisme/frontiercounts/frontier-counts/fc-pipeline
plugins:
        - search
        - table-reader
        - macros
        - markdownextradata:
                  jinja_options:
                          block_start_string: "[[%"
                          block_end_string: "%]]"
        - mkdocstrings:
                  handlers:
                          python:
                                  # Resolved relative to this file (project root).
                                  paths: [src]
                                  options:
                                          show_source: True
                                          show_root_heading: True
                                          show_signature_annotations: True
                                          show_category_heading: True

